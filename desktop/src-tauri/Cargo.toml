[package]
name = "claude-watchdog"
version = "0.2.0"
description = "Claude Desktop (MSIX) update watchdog: detects failed self-updates (0x80070020), stops leftover processes, relaunches Claude, and cleans orphaned package folders"
authors = ["ItBayMax"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "claude_watchdog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-updater = "2.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
once_cell = "1"
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

# Direct Win32 calls:
#  - Win32_System_EventLog          EvtQuery / EvtSubscribe (AppModel-Runtime event 208 = launch failure)
#  - Win32_Storage_Packaging_Appx   GetPackageFullName (which processes carry Claude package identity)
#  - Win32_System_Threading         OpenProcess / TerminateProcess
#  - Win32_Security                 elevation check
#  - Win32_UI_Shell                 ShellExecuteW ("runas" relaunch, shell:AppsFolder launch)
#  - Win32_System_Console           attach to the parent console for the CLI modes
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_EventLog",
  "Win32_System_Console",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
